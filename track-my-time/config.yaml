name: Track My Time
version: "0.2.0"
slug: track_my_time
description: Track consultancy hours per client/project and compare them against your nominal weekly hours.
url: https://github.com/ulfendk/timetracker
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto

# Fronted by Home Assistant's own ingress login - no separate credentials to manage.
ingress: true
ingress_port: 8099
panel_icon: mdi:clock-outline
panel_title: Track My Time
# Not admin-only, so any HA user you share this instance with can log their own hours (see the
# "second instance for a second person" note in DOCS.md for keeping totals fully separate).
panel_admin: false

# Auto-discovers a configured MQTT broker (e.g. the Mosquitto app) to publish HA sensor
# entities via MQTT Discovery. The app runs fine with this unavailable - it just skips
# publishing.
services:
  - mqtt:want

# Included in normal HA backups without needing to stop the app first. See DOCS.md for the
# app's own additional daily snapshotting under /data/backups.
backup: hot

# No "image:" here on purpose: once set, Supervisor always tries to PULL that tag and does NOT
# fall back to a local build if the pull fails (confirmed the hard way - a 403 from GHCR, not a
# fallback build, since no version tag has been pushed yet). Leaving it unset makes Supervisor
# build straight from the Dockerfile below, which is what you want both for local development
# and until you've actually published a matching image. Once ready to publish: push a "vX.Y.Z"
# git tag matching `version` above (triggers .github/workflows/build.yml), make the resulting
# GHCR package public, THEN add back:
#   image: ghcr.io/ulfendk/timetracker/track-my-time
